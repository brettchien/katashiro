<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- Second CSP layer (ADR §3.2): even though the manifest sandbox policy is the loosest any
       frame needs, this page runs no agent script, so a DOMPurify bypass still cannot run script. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>canvas</title>
  <link rel="stylesheet" href="src/canvas/canvas-frame.css">
  <link rel="stylesheet" href="vendor/reveal/reveal.css">
  <link rel="stylesheet" href="vendor/reveal/theme-dracula.css">
  <link rel="stylesheet" href="src/canvas/canvas-slides.css">
</head>
<body>
  <!-- Manifest sandbox page: opaque origin, no chrome.* APIs, no storage, no network. Everything it
       shows arrives in a `render` message from canvas.html. -->
  <article id="doc" class="doc" hidden></article>
  <div id="editor" class="editor" hidden></div>
  <div id="deck" class="reveal" hidden><div class="slides"></div></div>
  <figure id="pic" class="pic" hidden><img alt=""><figcaption></figcaption></figure>
  <!-- An html canvas before Run scripts (canvas-html §2.3): its sanitized document in a shadow root. -->
  <div id="htmlview" class="htmlview" hidden></div>
  <script src="vendor/markdown-it.iife.js"></script>
  <script src="vendor/dompurify.iife.js"></script>
  <script src="vendor/highlight.iife.js"></script>
  <script src="src/core/markdown.js"></script>
  <script src="vendor/reveal/reveal.js"></script>
  <script src="src/core/canvas-core.js"></script>
  <script src="src/canvas/canvas-frame.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas — Katashiro</title>
  <link rel="stylesheet" href="canvas.css">
</head>
<body>
  <!-- Trusted host (ADR docs/adr/canvas.md §3.2): title, version, banner. It never renders agent
       content itself; that happens in the sandboxed canvas-frame.html below. -->
  <header class="canvas-header">
    <!-- The canvas gallery (§3.7): every canvas across conversations. -->
    <button id="canvas-gallery" class="canvas-btn" data-icon="🗂️" type="button" title="畫布總覽（所有畫布）">🗂️ 總覽</button>
    <span class="canvas-icon" aria-hidden="true">📄</span>
    <h1 id="canvas-title" class="canvas-title">Canvas</h1>
    <span id="canvas-version" class="canvas-version"></span>
    <!-- Folder mirror (§3.6): this canvas's file state, and Reconnect folder when Chrome asks again. -->
    <span id="canvas-file" class="canvas-file" hidden></span>
    <button id="canvas-reconnect" class="canvas-btn" type="button" hidden>📁 Reconnect folder</button>
    <button id="canvas-rewrite" class="canvas-btn" type="button" title="把這個畫布重新寫進資料夾，恢復同步" hidden>📁 重新寫入</button>
    <button id="canvas-edit" class="canvas-btn" type="button" title="編輯（Milkdown）" hidden>✏️ 編輯</button>
    <!-- Edit mode only (§3.5): the editor's own undo / redo (its history, same as Ctrl/⌘+Z). -->
    <button id="canvas-undo" class="canvas-btn" type="button" title="復原" hidden>↶ 復原</button>
    <button id="canvas-redo" class="canvas-btn" type="button" title="重做" hidden>↷ 重做</button>
    <button id="canvas-save" class="canvas-btn primary" type="button" title="儲存（Ctrl/⌘+S）" hidden>💾 儲存</button>
    <button id="canvas-cancel" class="canvas-btn" type="button" title="結束編輯" hidden>結束編輯</button>
    <button id="canvas-revert" class="canvas-btn" data-icon="↺" type="button" title="還原成 agent 最後寫的版本（只在檢視模式）" hidden>↺ Revert to agent's</button>
    <button id="canvas-compare" class="canvas-btn" data-icon="⇆" type="button" title="在 Split View 裡並排比較 agent 最後寫的版本（唯讀）" hidden>⇆ Compare with agent's</button>
    <!-- Show changes (§3.10): hold the markers of previous → latest instead of fading them; one global switch. -->
    <button id="canvas-show-changes" class="canvas-btn" data-icon="◐" type="button" aria-pressed="false" hidden>◐ 顯示變更</button>
    <button id="canvas-end-compare" class="canvas-btn" data-icon="✕" type="button" title="關閉這個比較分頁，結束比較" hidden>✕ 結束比較</button>
    <button id="canvas-send" class="canvas-btn" data-icon="📤" type="button" title="把你的修改送給 agent" hidden>📤 Send to agent</button>
    <button id="canvas-ask" class="canvas-btn" data-icon="💬" type="button" title="針對選取的文字問 agent（或請它修改）" hidden>💬 Ask agent</button>
    <!-- Send selection (§3.7, Brett 2026-10-13): the selection as is, no request, no popover. -->
    <button id="canvas-send-sel" class="canvas-btn" data-icon="📨" type="button" title="把選取的文字直接傳給 agent" hidden>📨 Send selection</button>
    <button id="canvas-download" class="canvas-btn" type="button" title="下載成 .md" hidden>⬇ .md</button>
    <button id="canvas-print" class="canvas-btn" type="button" title="列印／存成 PDF" hidden>🖨 PDF</button>
    <button id="canvas-delete" class="canvas-btn" type="button" title="刪除這個畫布" hidden>🗑 刪除</button>
    <span class="canvas-banner" title="Agent-generated content — Katashiro never asks for passwords or keys here.">Agent-generated content — Katashiro never asks for passwords or keys here.</span>
  </header>
  <div id="canvas-notice-bar" class="canvas-notice" hidden><span id="canvas-notice"></span><button id="canvas-notice-action" class="canvas-btn" type="button" hidden></button></div>
  <main id="canvas-main" class="canvas-main"></main>
  <!-- Conflict view (§3.5): the user's unsaved text beside the latest. Plain <textarea> values, never HTML. -->
  <div id="canvas-conflict" class="canvas-conflict" hidden>
    <div class="conflict-box">
      <h2>儲存時發生衝突</h2>
      <p id="conflict-why"></p>
      <div class="conflict-panes">
        <label>你的版本（尚未儲存）<textarea id="conflict-mine" readonly></textarea></label>
        <label id="conflict-latest-label">目前的版本<textarea id="conflict-latest" readonly></textarea></label>
      </div>
      <div class="conflict-actions">
        <button id="conflict-keep" class="canvas-btn primary" type="button">保留我的（存成最新版）</button>
        <button id="conflict-discard" class="canvas-btn" type="button">放棄我的</button>
        <button id="conflict-back" class="canvas-btn" type="button">回到編輯</button>
      </div>
    </div>
  </div>
  <!-- Ask agent (§3.7, Brett 2026-10-12): the 💬 beside the selection and the request popover.
       Host elements positioned over the frame, never frame content, so a canvas cannot imitate them.
       The excerpt is set with textContent. -->
  <button id="ask-pill" class="ask-pill" type="button" title="針對選取的文字問 agent" aria-label="針對選取的文字問 agent" hidden>💬</button>
  <!-- Send selection (Brett 2026-10-13): beside the 💬, shown and hidden with it. -->
  <button id="send-pill" class="ask-pill" type="button" title="把選取的文字直接傳給 agent" aria-label="把選取的文字直接傳給 agent" hidden>📨</button>
  <div id="ask-pop" class="ask-pop" role="dialog" aria-label="針對選取的文字問 agent" hidden>
    <div class="ask-pop-head">
      <span class="ask-pop-icon" aria-hidden="true">💬</span>
      <span id="ask-excerpt" class="ask-excerpt"></span>
      <button id="ask-close" class="ask-close" type="button" title="關閉（Esc）" aria-label="關閉">✕</button>
    </div>
    <textarea id="ask-note" class="ask-note" rows="3" aria-label="要 agent 對選取的文字做什麼" placeholder="要 agent 做什麼？例如：改短一點、翻成英文"></textarea>
    <div class="ask-pop-foot">
      <span id="ask-status" class="ask-status" role="status" aria-live="polite"></span>
      <span class="ask-keys">Enter 送出 · Shift+Enter 換行</span>
      <button id="ask-send" class="canvas-btn primary" type="button">送出</button>
    </div>
  </div>
  <script src="canvas-store.js"></script>
  <script src="canvas-mirror.js"></script>
  <script src="canvas-core.js"></script>
  <script src="canvas-tabs.js"></script>
  <script src="canvas.js"></script>
</body>
</html>

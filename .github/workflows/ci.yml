name: ci

# Run the unit tests and the puppeteer smokes on every PR and on pushes to main, so a regression is
# caught before merge — not first at release time (release.yml runs the unit tests only on a tag push).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only supersede stale PR runs; every push to main keeps its own result so a breaking
  # merge can be pinpointed later. main is grouped per sha because a group holds at most one
  # pending run — a shared group would still cancel queued main runs on rapid merges.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Parse every runtime script, including the ones no test imports (src/background.js, src/page/).
      - name: Syntax check
        run: |
          set -euo pipefail
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          for f in scripts/*.sh skills/*/scripts/*.sh; do bash -n "$f"; done

      - name: Test
        run: node --test test/*.test.js

  # The puppeteer smokes (scripts/smoke-*.mjs): the real side panel, canvas and gallery pages in a
  # headless Chrome, with chrome.* stubbed. Chrome is pinned in package.json (config.chromeVersion).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Chrome version
        id: chrome
        run: echo "version=$(node -p "require('./package.json').config.chromeVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache headless Chrome
        uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ steps.chrome.outputs.version }}

      # A no-op when the cache restored it.
      - name: Install headless Chrome
        run: npm run chrome

      - name: Smoke
        run: npm run smoke

  # T2 E2E (e2e/): the REAL extension loaded in full Chrome for Testing (new headless), its real
  # side panel, tab groups, runtime messaging and notifications, against a fake ACP gateway
  # (e2e/fake-gateway.mjs). Same pinned Chrome version as the smokes, but the full build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Chrome version
        id: chrome
        run: echo "version=$(node -p "require('./package.json').config.chromeVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-full-${{ runner.os }}-${{ steps.chrome.outputs.version }}

      # A no-op when the cache restored it.
      - name: Install Chrome for Testing
        run: npm run chrome:full

      # ubuntu-latest ships Google Chrome, so its shared libraries are normally all there. If one
      # is missing, let @puppeteer/browsers install the system packages (needs root).
      - name: Chrome system libraries
        run: |
          set -euo pipefail
          exe=$(node -e "const b=require('@puppeteer/browsers');console.log(b.computeExecutablePath({browser:b.Browser.CHROME,buildId:'${{ steps.chrome.outputs.version }}',cacheDir:'.cache/chrome'}))")
          missing=$(ldd "$exe" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            sudo env "PATH=$PATH" npx --no-install @puppeteer/browsers install "chrome@${{ steps.chrome.outputs.version }}" --path .cache/chrome --install-deps
          fi
          "$exe" --version

      - name: E2E
        run: npm run e2e

name: ci

# Run the unit tests and the puppeteer smokes on every PR and on pushes to main, so a regression is
# caught before merge — not first at release time (release.yml runs the unit tests only on a tag push).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only supersede stale PR runs; every push to main keeps its own result so a breaking
  # merge can be pinpointed later. main is grouped per sha because a group holds at most one
  # pending run — a shared group would still cancel queued main runs on rapid merges.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Parse every runtime script, including the ones no test imports (background.js, page/).
      - name: Syntax check
        run: |
          set -euo pipefail
          for f in *.js page/*.js; do node --check "$f"; done
          for f in scripts/*.sh skills/*/scripts/*.sh; do bash -n "$f"; done

      - name: Test
        run: node --test test/*.test.js

  # The puppeteer smokes (scripts/smoke-*.mjs): the real side panel, canvas and gallery pages in a
  # headless Chrome, with chrome.* stubbed. Chrome is pinned in package.json (config.chromeVersion).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Chrome version
        id: chrome
        run: echo "version=$(node -p "require('./package.json').config.chromeVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache headless Chrome
        uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ steps.chrome.outputs.version }}

      # A no-op when the cache restored it.
      - name: Install headless Chrome
        run: npm run chrome

      - name: Smoke
        run: npm run smoke

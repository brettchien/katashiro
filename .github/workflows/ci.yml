name: ci

# Run the unit tests and the puppeteer smokes on every PR and on pushes to main, so a regression is
# caught before merge — not first at release time (release.yml runs the unit tests only on a tag push).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Only supersede stale PR runs; every push to main keeps its own result so a breaking
  # merge can be pinpointed later. main is grouped per sha because a group holds at most one
  # pending run — a shared group would still cancel queued main runs on rapid merges.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Parse every runtime script, including the ones no test imports (src/background.js, src/page/).
      - name: Syntax check
        run: |
          set -euo pipefail
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          for f in scripts/*.sh skills/*/scripts/*.sh; do bash -n "$f"; done

      - name: Test
        run: node --test test/*.test.js

  # The puppeteer smokes (scripts/smoke-*.mjs): the real side panel, canvas and gallery pages in a
  # headless Chrome, with chrome.* stubbed. Chrome is pinned in package.json (config.chromeVersion).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Chrome version
        id: chrome
        run: echo "version=$(node -p "require('./package.json').config.chromeVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache headless Chrome
        uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ steps.chrome.outputs.version }}

      # A no-op when the cache restored it.
      - name: Install headless Chrome
        run: npm run chrome

      - name: Smoke
        run: npm run smoke

  # Canvas screenshots (scripts/theme-shots.mjs) of this commit vs main, same runner and same pinned
  # Chrome: a CSS refactor must leave them byte-identical (ADR docs/adr/canvas-themes.md). Both sets
  # are uploaded as the "theme-shots" artifact, on success too, so a visual change can be looked at.
  theme-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Chrome version
        id: chrome
        run: echo "version=$(node -p "require('./package.json').config.chromeVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache headless Chrome
        uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-headless-shell-${{ runner.os }}-${{ steps.chrome.outputs.version }}

      - name: Install headless Chrome
        run: npm run chrome

      # main's canvas files, shot by this commit's script and browser.
      - name: Baseline (main)
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/main" origin/main
          node scripts/theme-shots.mjs "$RUNNER_TEMP/shots/main" "$RUNNER_TEMP/main"

      - name: This commit
        run: node scripts/theme-shots.mjs "$RUNNER_TEMP/shots/head"

      # The same commit again, to a scratch dir: a shot that differs from itself is unstable — reported
      # as such, so it is never mistaken for a change (or a regression) in the compare below.
      - name: This commit, again
        run: node scripts/theme-shots.mjs "$RUNNER_TEMP/shots/again"

      - name: Compare
        run: |
          set -euo pipefail
          unstable=0
          for f in "$RUNNER_TEMP"/shots/head/*.png; do
            n=$(basename "$f")
            cmp -s "$f" "$RUNNER_TEMP/shots/again/$n" || { echo "UNSTABLE $n (this commit shot twice differs): $(node "$GITHUB_WORKSPACE/scripts/shot-diff.mjs" "$f" "$RUNNER_TEMP/shots/again/$n")"; unstable=1; }
          done
          [ "$unstable" = 0 ] || { echo "::error::theme-shots: unstable screenshots — fix the shot, not the code"; exit 1; }
          cd "$RUNNER_TEMP/shots"
          diff <(cd main && ls) <(cd head && ls)
          # scripts/theme-shots-changed.txt: "<branch> <shot>" lines — the shots that branch changes on purpose
          # (reported, not failed). Only this run's own branch counts, so the list never excuses another
          # branch's change and needs no clean-up after a merge.
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          expected=$(awk -v b="$branch" '!/^#/ && $1 == b { print $2 }' "$GITHUB_WORKSPACE/scripts/theme-shots-changed.txt" 2>/dev/null || true)
          bad=0
          stale=""
          for f in main/*.png; do
            n=$(basename "$f")
            if cmp -s "$f" "head/$n"; then
              echo "same    $n"
              if grep -qxF "$n" <<<"$expected"; then stale="$stale $n"; fi
            elif grep -qxF "$n" <<<"$expected"; then echo "changed $n (expected for $branch)"
            else echo "DIFFERS $n: $(node "$GITHUB_WORKSPACE/scripts/shot-diff.mjs" "$f" "head/$n")"; bad=1; fi
          done
          if [ -n "$stale" ]; then
            echo "::warning file=scripts/theme-shots-changed.txt::listed for $branch but identical to main:$stale — remove them"
          fi
          exit $bad

      # Review shots (review/, this commit only): the same fixtures with a CJK font, so the Chinese in the
      # header, gallery and Settings reads in the shots posted for review. Not compared — with Noto CJK
      # the page shots are not byte-stable from one Chrome launch to the next (±1 at button corners),
      # so the main/head compare above runs without it.
      - name: CJK font
        if: always()
        continue-on-error: true           # review shots only: an apt hiccup must not fail the compare
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Review shots
        if: always()
        continue-on-error: true
        run: node scripts/theme-shots.mjs "$RUNNER_TEMP/shots/review"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # T2 E2E (e2e/): the REAL extension loaded in full Chrome for Testing (new headless), its real
  # side panel, tab groups, runtime messaging and notifications, against a fake ACP gateway
  # (e2e/fake-gateway.mjs). Same pinned Chrome version as the smokes, but the full build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Chrome version
        id: chrome
        run: echo "version=$(node -p "require('./package.json').config.chromeVersion")" >> "$GITHUB_OUTPUT"

      - name: Cache Chrome for Testing
        uses: actions/cache@v4
        with:
          path: .cache/chrome
          key: chrome-full-${{ runner.os }}-${{ steps.chrome.outputs.version }}

      # A no-op when the cache restored it.
      - name: Install Chrome for Testing
        run: npm run chrome:full

      # ubuntu-latest ships Google Chrome, so its shared libraries are normally all there. If one
      # is missing, let @puppeteer/browsers install the system packages (needs root).
      - name: Chrome system libraries
        run: |
          set -euo pipefail
          exe=$(node -e "const b=require('@puppeteer/browsers');console.log(b.computeExecutablePath({browser:b.Browser.CHROME,buildId:'${{ steps.chrome.outputs.version }}',cacheDir:'.cache/chrome'}))")
          missing=$(ldd "$exe" | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            sudo env "PATH=$PATH" npx --no-install @puppeteer/browsers install "chrome@${{ steps.chrome.outputs.version }}" --path .cache/chrome --install-deps
          fi
          "$exe" --version

      - name: E2E
        run: npm run e2e

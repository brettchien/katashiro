name: release

# Push a tag like `v2.1.0` to cut a release: runs the tests, packages the extension
# as a zip (runtime files only), and publishes a GitHub Release with auto-generated notes.
# The tag must match manifest.json's version.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node --test test/*.test.js

      - name: Package extension
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          # Runtime files only — no test/, docs/, *.md, or .git.
          zip -r "katashiro-${VERSION}.zip" \
            manifest.json background.js \
            sidepanel.html sidepanel.css sidepanel.js \
            browser-mcp.js room-core.js markdown.js \
            page vendor \
            icon.png icon16.png icon32.png icon48.png icon128.png

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "katashiro-${VERSION}.zip" \
            --title "katashiro $GITHUB_REF_NAME" \
            --generate-notes

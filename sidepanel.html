<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katashiro - OpenAB Companion</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-area">
          <img src="icon.png" alt="Katashiro Logo" class="brand-logo">
          <div class="status-indicator online"></div>
        </div>
        <div class="brand-info">
          <h1>Katashiro</h1>
          <span class="subtitle" id="active-agent-label">OpenAB Companion</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="clear-chat-btn" title="清除聊天畫面">🧹</button>
        <button id="settings-btn" title="設定">⚙️</button>
      </div>
    </header>

    <!-- Main Views -->
    <main class="app-main">
      <!-- Connection Setup View (if not connected) -->
      <section id="setup-view" class="view">
        <div class="setup-card">
          <p class="setup-desc">請輸入 WebSocket 伺服器網址以連線至 OpenAB 代理端點：</p>
          <div class="input-group">
            <label for="ws-url-input">WebSocket URL</label>
            <input type="text" id="ws-url-input" placeholder="ws://localhost:8080/acp" value="ws://localhost:8080/acp">
          </div>
          <button id="connect-btn" class="primary-btn">建立連線</button>
        </div>
      </section>

      <!-- Chatroom View (active when connected) -->
      <section id="chat-view" class="view active">
        <div class="chat-container">
          <!-- Roster: one chip per agent (online + browser status) -->
          <div id="roster" class="roster"><!-- rendered by sidepanel.js --></div>
          <!-- Messages list -->
          <div id="messages-list" class="messages-list">
            <!-- System Welcome -->
            <div class="message system">
              <div class="system-text">歡迎使用 Katashiro！已準備好接收 OpenAB 的 WebSocket 訊息流。</div>
            </div>
          </div>

          <!-- Jump to latest: shown when the user has scrolled up while new content arrives -->
          <button id="jump-latest" class="jump-latest" hidden>↓ 最新訊息</button>

          <!-- Input bar -->
          <div class="chat-input-area">
            <textarea id="message-input" placeholder="輸入訊息..." rows="1"></textarea>
            <!-- Stop: shown only while an agent turn is in flight; cancels via session/cancel -->
            <button id="stop-btn" class="stop-btn" hidden title="停止">
              <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" /></svg>
            </button>
            <button id="send-btn" class="send-btn" disabled>
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Settings Panel (Modal-like Overlay) -->
      <section id="settings-view" class="view">
        <div class="settings-card">
          <h2>Agent 設定</h2>

          <!-- Room routing config -->
          <div class="input-group">
            <label>房間模式</label>
            <div id="mode-toggle" class="mode-toggle">
              <button id="mode-mention" class="mode-btn" data-mode="mention">＠ 指名</button>
              <button id="mode-ambient" class="mode-btn" data-mode="ambient">Ambient 全體</button>
            </div>
            <span class="mode-hint" id="mode-hint"></span>
            <label for="loopguard-cap">連續接話上限（loop guard）</label>
            <input type="number" id="loopguard-cap" class="agent-input" min="1" step="1" value="6">
          </div>

          <!-- Browser write consent (act mode) -->
          <div class="input-group">
            <label>瀏覽器寫入</label>
            <div id="act-mode-toggle" class="mode-toggle">
              <button id="act-read" class="mode-btn" data-act="read">👁 唯讀</button>
              <button id="act-write" class="mode-btn" data-act="write">✋ 可操作</button>
            </div>
            <span class="mode-hint" id="act-mode-hint"></span>
          </div>

          <!-- Browser origin allowlist (Phase 3 gate #2): which sites the agent may read/act on -->
          <div class="input-group">
            <label>授權網域</label>
            <span class="mode-hint">只有在此授權的網域，agent 才讀得到／操作得到（含唯讀）。走 Chrome 原生權限逐站授權，隨時可移除。</span>
            <div class="origin-add">
              <input type="text" id="grant-origin-input" class="agent-input" placeholder="https://example.com">
              <button id="grant-origin-btn" class="secondary-btn">＋ 授權</button>
            </div>
            <div id="origin-list" class="origin-list"><!-- rendered by sidepanel.js --></div>
          </div>

          <!-- Existing agents -->
          <div class="input-group">
            <label>已設定的 Agent</label>
            <div id="agent-list" class="agent-list"><!-- rendered by sidepanel.js --></div>
          </div>

          <!-- Add a new agent -->
          <div class="input-group">
            <label>新增 Agent</label>
            <input type="text" id="new-agent-name" class="agent-input" placeholder="名稱（例如 OpenAB）">
            <input type="text" id="new-agent-url" class="agent-input" placeholder="ws://localhost:8080/acp">
            <input type="password" id="new-agent-token" class="agent-input" placeholder="Token（伺服器需驗證時填）">
            <button id="add-agent-btn" class="secondary-btn">＋ 新增</button>
          </div>

          <div class="button-row">
            <button id="cancel-settings-btn" class="secondary-btn">關閉</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Vendored, eval-free bundles (MV3 script-src 'self'); markdown.js defines the single
       sanitized renderMarkdown sink and must load before sidepanel.js uses it. -->
  <script src="vendor/markdown-it.iife.js"></script>
  <script src="vendor/dompurify.iife.js"></script>
  <script src="vendor/highlight.iife.js"></script>
  <script src="markdown.js"></script>
  <script src="browser-mcp.js"></script>
  <script src="room-core.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
